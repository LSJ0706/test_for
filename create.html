<!DOCTYPE html>
<html lang="ko">
      <head>
            <meta charset="UTF-8" />
            <title>모바일 청첩장 상세 입력</title>
            <style>
                  body {
                        font-family: 'Malgun Gothic', sans-serif;
                        line-height: 1.6;
                        max-width: 900px;
                        margin: 20px auto;
                        padding: 20px;
                        background: #f4f7f6;
                  }
                  section {
                        background: white;
                        padding: 25px;
                        margin-bottom: 25px;
                        border-radius: 12px;
                        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
                  }
                  h2 {
                        border-left: 5px solid #ffb6c1;
                        padding-left: 15px;
                        margin-bottom: 20px;
                        color: #444;
                  }
                  .form-group {
                        margin-bottom: 15px;
                  }
                  label {
                        display: block;
                        font-weight: bold;
                        margin-bottom: 5px;
                        font-size: 0.9em;
                        color: #555;
                  }
                  input[type='text'],
                  input[type='datetime-local'],
                  textarea {
                        width: 100%;
                        padding: 10px;
                        border: 1px solid #ddd;
                        border-radius: 6px;
                        box-sizing: border-box;
                  }
                  .address-group {
                        display: flex;
                        gap: 10px;
                        margin-bottom: 5px;
                  }
                  .btn-search {
                        background: #555;
                        color: white;
                        border: none;
                        padding: 0 15px;
                        border-radius: 6px;
                        cursor: pointer;
                        white-space: nowrap;
                  }
                  .grid-container {
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 20px;
                  }
                  .person-card {
                        background: #fffcfc;
                        border: 1px solid #ffe4e1;
                        padding: 15px;
                        border-radius: 8px;
                        margin-bottom: 10px;
                  }
                  .btn-submit {
                        background: #ffb6c1;
                        color: white;
                        padding: 15px;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        width: 100%;
                        font-size: 18px;
                        font-weight: bold;
                        margin-top: 10px;
                  }
                  .alive-check {
                        display: flex;
                        gap: 10px;
                        margin-top: 8px;
                        font-size: 0.9em;
                  }
                  .alive-check label {
                        font-weight: normal;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        gap: 4px;
                  }
            </style>
      </head>
      <body>
            <h1>💌 청첩장 정보 입력</h1>

            <section id="section-wedding">
                  <h2>1. 예식장 정보</h2>
                  <div class="form-group">
                        <label>예식 일시</label>
                        <input type="datetime-local" id="weddingDate" />
                  </div>

                  <div class="form-group">
                        <label>예식장 주소</label>
                        <div class="address-group">
                              <input type="text" id="weddingAddress" placeholder="주소 검색을 이용해 주세요" readonly />
                              <button type="button" class="btn-search" onclick="execDaumPostcode()">주소 검색</button>
                        </div>
                        <input
                              type="text"
                              id="weddingHole"
                              placeholder="상세 장소 (예: 1층 다이아몬드홀, OO컨벤션)"
                              style="margin-top: 5px"
                        />
                  </div>

                  <div class="form-group">
                        <label>초대의 글</label>
                        <textarea id="weddingContent" rows="4" placeholder="인사말을 입력하세요"></textarea>
                  </div>
            </section>

            <div class="grid-container">
                  <section class="side-group" data-side="groom">
                        <h2>2. 신랑측 정보</h2>
                        <div class="person-card" data-role="groom">
                              <h3>신랑 (Groom)</h3>
                              <input type="text" class="p-name" placeholder="신랑 성함" />
                              <input type="text" class="p-phone" placeholder="연락처" style="margin-top: 5px" />
                              <input type="text" class="p-bank" placeholder="은행명" style="margin-top: 5px" />
                              <input type="text" class="p-account" placeholder="계좌번호" style="margin-top: 5px" />
                        </div>
                        <div class="person-card" data-role="father">
                              <h3>아버지 (Father)</h3>
                              <input type="text" class="p-name" placeholder="성함" />
                              <input type="text" class="p-phone" placeholder="연락처" style="margin-top: 5px" />
                              <input type="text" class="p-bank" placeholder="은행명" style="margin-top: 5px" />
                              <input type="text" class="p-account" placeholder="계좌번호" style="margin-top: 5px" />
                              <div class="alive-check">
                                    <label><input type="radio" class="p-alive" name="g_f_alive" value="1" checked /> 생존</label>
                                    <label><input type="radio" class="p-alive" name="g_f_alive" value="0" /> 작고</label>
                              </div>
                        </div>
                        <div class="person-card" data-role="mother">
                              <h3>어머니 (Mother)</h3>
                              <input type="text" class="p-name" placeholder="성함" />
                              <input type="text" class="p-phone" placeholder="연락처" style="margin-top: 5px" />
                              <input type="text" class="p-bank" placeholder="은행명" style="margin-top: 5px" />
                              <input type="text" class="p-account" placeholder="계좌번호" style="margin-top: 5px" />
                              <div class="alive-check">
                                    <label><input type="radio" class="p-alive" name="g_m_alive" value="1" checked /> 생존</label>
                                    <label><input type="radio" class="p-alive" name="g_m_alive" value="0" /> 작고</label>
                              </div>
                        </div>
                  </section>

                  <section class="side-group" data-side="bride">
                        <h2>3. 신부측 정보</h2>
                        <div class="person-card" data-role="bride">
                              <h3>신부 (Bride)</h3>
                              <input type="text" class="p-name" placeholder="신부 성함" />
                              <input type="text" class="p-phone" placeholder="연락처" style="margin-top: 5px" />
                              <input type="text" class="p-bank" placeholder="은행명" style="margin-top: 5px" />
                              <input type="text" class="p-account" placeholder="계좌번호" style="margin-top: 5px" />
                        </div>
                        <div class="person-card" data-role="father">
                              <h3>아버지 (Father)</h3>
                              <input type="text" class="p-name" placeholder="성함" />
                              <input type="text" class="p-phone" placeholder="연락처" style="margin-top: 5px" />
                              <input type="text" class="p-bank" placeholder="은행명" style="margin-top: 5px" />
                              <input type="text" class="p-account" placeholder="계좌번호" style="margin-top: 5px" />
                              <div class="alive-check">
                                    <label><input type="radio" class="p-alive" name="b_f_alive" value="1" checked /> 생존</label>
                                    <label><input type="radio" class="p-alive" name="b_f_alive" value="0" /> 작고</label>
                              </div>
                        </div>
                        <div class="person-card" data-role="mother">
                              <h3>어머니 (Mother)</h3>
                              <input type="text" class="p-name" placeholder="성함" />
                              <input type="text" class="p-phone" placeholder="연락처" style="margin-top: 5px" />
                              <input type="text" class="p-bank" placeholder="은행명" style="margin-top: 5px" />
                              <input type="text" class="p-account" placeholder="계좌번호" style="margin-top: 5px" />
                              <div class="alive-check">
                                    <label><input type="radio" class="p-alive" name="b_m_alive" value="1" checked /> 생존</label>
                                    <label><input type="radio" class="p-alive" name="b_m_alive" value="0" /> 작고</label>
                              </div>
                        </div>
                  </section>
            </div>

            <section id="section-images">
                  <h2>4. 갤러리 설정</h2>
                  <div class="form-group">
                        <label>대표 이미지 (Thumbnail)</label>
                        <input type="file" id="inputThumbnail" accept="image/*" />
                  </div>
                  <div class="form-group">
                        <label>갤러리 사진</label>
                        <input type="file" id="inputGallery" accept="image/*" multiple />
                  </div>
            </section>

            <button type="button" class="btn-submit" id="createBtn">청첩장 정보 저장하기</button>

            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
            <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
            <script src="utils.js"></script>
            <script src="card.js"></script>
      </body>
</html>
