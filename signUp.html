<!DOCTYPE html>
<html lang="ko">
      <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>설렘카드 - 회원가입</title>
            <style>
                  /* 기존 디자인 톤 유지 */
                  body {
                        font-family: 'Malgun Gothic', sans-serif;
                        background: #f4f7f6;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        min-height: 100vh;
                        margin: 0;
                        padding: 20px;
                  }
                  .signup-card {
                        background: white;
                        padding: 40px;
                        border-radius: 12px;
                        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
                        width: 100%;
                        max-width: 450px;
                        text-align: center;
                  }

                  /* 로고 스타일 */
                  .title-label {
                        font-size: 24px;
                        font-weight: bold;
                        color: #ffb6c1;
                        display: block;
                        margin-bottom: 30px;
                  }

                  /* 폼 내부 div 및 p 스타일링 */
                  #signUpForm div {
                        text-align: left;
                        margin-bottom: 15px;
                  }
                  #signUpForm p {
                        font-weight: bold;
                        font-size: 0.9em;
                        color: #555;
                        margin: 0 0 5px 0;
                  }

                  /* 입력창 스타일 */
                  input[type='email'],
                  input[type='password'],
                  input[type='text'] {
                        width: 100%;
                        padding: 12px;
                        border: 1px solid #ddd;
                        border-radius: 6px;
                        box-sizing: border-box;
                  }
                  input:focus {
                        outline: none;
                        border-color: #ffb6c1;
                  }

                  /* 중복확인 버튼 */
                  #checkDuplicateEmailBtn {
                        background: #555;
                        color: white;
                        border: none;
                        padding: 8px 15px;
                        border-radius: 6px;
                        cursor: pointer;
                        margin-top: 5px;
                        width: 100%;
                  }

                  /* 회원가입 버튼 */
                  #signUpBtn {
                        background: #ffb6c1;
                        color: white;
                        padding: 15px;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        width: 100%;
                        font-size: 18px;
                        font-weight: bold;
                        margin-top: 10px;
                  }

                  /* 하단 링크 */
                  .footer-link {
                        margin-top: 20px;
                        display: block;
                  }
                  .footer-link a {
                        text-decoration: none;
                        color: #888;
                        font-size: 0.9em;
                  }
            </style>
      </head>
      <body>
            <div class="signup-card">
                  <span class="title-label">회원 가입</span>

                  <form id="signUpForm">
                        <div>
                              <p>이메일</p>
                              <input type="email" id="signUpEmail" required />
                              <button type="button" id="checkDuplicateEmailBtn">중복확인</button>
                        </div>

                        <div>
                              <p>비밀번호</p>
                              <input type="password" id="signUpPass" required />
                        </div>

                        <div>
                              <p>비밀번호 확인</p>
                              <input type="password" id="signUpPassConfirm" required />
                        </div>

                        <span id="passErr" style="display: none; color: red; font-size: 0.85em; text-align: left; margin-bottom: 10px">
                              비밀번호가 일치하지 않습니다.
                        </span>

                        <div>
                              <p>이름</p>
                              <input type="text" id="signUpName" required />
                        </div>

                        <button type="submit" id="signUpBtn">회원가입</button>
                  </form>

                  <span class="footer-link">
                        <a href="index.html"><p>이미 회원이 이신가요?</p></a>
                  </span>
            </div>

            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
            <script src="utils.js"></script>
            <script src="auth.js"></script>
      </body>
</html>
