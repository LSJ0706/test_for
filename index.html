<!DOCTYPE html>
<html lang="ko">
      <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>설렘카드 - 로그인</title>
            <style>
                  /* 청첩장 작성 페이지와 동일한 톤앤매너 */
                  body {
                        font-family: 'Malgun Gothic', sans-serif;
                        line-height: 1.6;
                        background: #f4f7f6;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        height: 100vh;
                        margin: 0;
                  }

                  .login-container {
                        background: white;
                        padding: 40px;
                        border-radius: 12px;
                        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
                        width: 100%;
                        max-width: 400px;
                        text-align: center;
                  }

                  .logo-text {
                        font-size: 24px;
                        font-weight: bold;
                        color: #ffb6c1; /* 청첩장 페이지 포인트 컬러 */
                        display: block;
                        margin-bottom: 30px;
                  }

                  .form-group {
                        text-align: left;
                        margin-bottom: 15px;
                  }

                  .form-group span {
                        display: block;
                        font-weight: bold;
                        font-size: 0.9em;
                        color: #555;
                        margin-bottom: 5px;
                        margin-left: 2px;
                  }

                  input[type='email'],
                  input[type='password'] {
                        width: 100%;
                        padding: 12px;
                        border: 1px solid #ddd;
                        border-radius: 6px;
                        box-sizing: border-box;
                        transition: border-color 0.3s;
                  }

                  input:focus {
                        outline: none;
                        border-color: #ffb6c1;
                  }

                  /* 경고 메시지 스타일 */
                  .authValidation {
                        display: none; /* 기본적으로 숨김, 필요 시 JS로 block */
                        background: #fff0f0;
                        color: #e74c3c;
                        border-radius: 6px;
                        padding: 1px 10px;
                        margin-bottom: 15px;
                        font-size: 0.85em;
                        border-left: 4px solid #e74c3c;
                  }

                  #signInBtn {
                        background: #ffb6c1;
                        color: white;
                        padding: 12px;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        width: 100%;
                        font-size: 16px;
                        font-weight: bold;
                        margin-top: 10px;
                        transition: background 0.3s;
                  }

                  #signInBtn:hover {
                        background: #ff9aa2;
                  }

                  .footer-link {
                        margin-top: 20px;
                        display: block;
                  }

                  .footer-link a {
                        text-decoration: none;
                        color: #888;
                        font-size: 0.9em;
                  }

                  .footer-link a:hover {
                        text-decoration: underline;
                        color: #ffb6c1;
                  }
            </style>
      </head>
      <body>
            <div class="login-container">
                  <span class="logo-text">💌 설렘카드</span>

                  <form id="signInForm">
                        <span class="authValidation">
                              <p>계정이 없거나 비밀번호가 일치하지 않습니다.</p>
                        </span>

                        <div class="form-group">
                              <span>이메일</span>
                              <input type="email" id="signInEmail" placeholder="example@email.com" required />
                        </div>

                        <div class="form-group">
                              <span>비밀번호</span>
                              <input type="password" id="signInPass" placeholder="비밀번호를 입력하세요" required />
                        </div>

                        <button type="submit" id="signInBtn">로그인</button>
                  </form>

                  <span class="footer-link">
                        <a href="signUp.html">아직 회원이 아니신가요?</a>
                  </span>
            </div>

            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
            <script src="utils.js"></script>
            <script src="auth.js"></script>
      </body>
</html>
