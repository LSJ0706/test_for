<!DOCTYPE html>
<html lang="ko">
      <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="stylesheet" href="./css/global.css" />
            <link rel="stylesheet" href="./css/auth.css" />
            <title>설렘카드</title>
      </head>
      <body>
            <div class="sign-up-card">
                  <span class="title-label">회원 가입</span>

                  <form id="sign-up-form">
                        <div>
                              <p>이메일</p>
                              <input type="email" id="sign-up-email" required />
                              <button type="button" id="btn-check-duplicate-email">중복확인</button>
                        </div>

                        <div>
                              <p>비밀번호</p>
                              <input type="password" id="sign-up-pass" required />
                        </div>

                        <div>
                              <p>비밀번호 확인</p>
                              <input type="password" id="sign-up-pass-confirm" required />
                        </div>

                        <span id="pass-err" style="display: none; color: red; font-size: 0.85em; text-align: left; margin-bottom: 10px">
                              비밀번호가 일치하지 않습니다.
                        </span>

                        <div>
                              <p>이름</p>
                              <input type="text" id="sign-up-name" required />
                        </div>

                        <button type="submit" id="btn-sign-up">회원가입</button>
                  </form>

                  <span class="footer-link">
                        <a href="index.html"><p>이미 회원이 이신가요?</p></a>
                  </span>
            </div>

            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
            <script src="/js/utils.js"></script>
            <script src="/js/auth.js"></script>
      </body>
</html>
