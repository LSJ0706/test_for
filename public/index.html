<!DOCTYPE html>
<html lang="ko">
      <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="stylesheet" href="./css/global.css" />
            <link rel="stylesheet" href="./css/auth.css" />
            <title>설렘카드</title>
      </head>
      <body>
            <div class="login-container">
                  <span class="logo-text">💌 설렘카드</span>

                  <form id="sign-in-form">
                        <span class="auth-validation">
                              <p>계정이 없거나 비밀번호가 일치하지 않습니다.</p>
                        </span>

                        <div class="form-group">
                              <span>이메일</span>
                              <input type="email" id="sign-in-email" placeholder="example@email.com" required />
                        </div>

                        <div class="form-group">
                              <span>비밀번호</span>
                              <input type="password" id="sign-in-pass" placeholder="비밀번호를 입력하세요" required />
                        </div>

                        <button type="submit" id="btn-sign-in">로그인</button>
                  </form>

                  <span class="footer-link">
                        <a href="/signUp">아직 회원이 아니신가요?</a>
                  </span>
            </div>

            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
            <script src="/js/utils.js"></script>
            <script src="/js/auth.js"></script>
      </body>
</html>
